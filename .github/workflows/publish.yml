# Doku (Quarto-Website in docs/) bei jedem Push auf main nach GitHub Pages
# Pages-Einstellung: Settings -> Pages -> Source "GitHub Actions" (kein gh-pages-Branch nötig)
name: Doku publizieren

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:      # manuell auslösbar (Tab "Actions")

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # eda.ipynb wird nicht ausgeführt (gespeicherte Outputs) -> kein Python nötig
      - uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
