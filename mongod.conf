# MongoDB-Konfiguration (Vorlage aus Slides SW 4). Pfade anpassen!
# Start ohne Service:  mongod --config mongod.conf
# macOS/Homebrew: brew services start mongodb-community nutzt eine eigene Config.

systemLog:
  destination: file
  logAppend: true
  path: /opt/homebrew/var/log/mongodb/mongo.log   # set your path here!

storage:
  dbPath: /opt/homebrew/var/mongodb               # set your path here!

processManagement:
  fork: false
  timeZoneInfo: /usr/share/zoneinfo

net:
  port: 27017
  bindIp: 127.0.0.1
